[workspace]
members = [
    "crates/claw-config",
    "crates/claw-core",
    "crates/claw-gateway",
    "crates/claw-routing",
    "crates/claw-channels",
    "crates/claw-plugins",
    "crates/claw-dispatch",
    "crates/claw-db",
    "crates/claw-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Wolfschanze-Berlin/claw-rust"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# Web framework
actix-web = "4"
actix-ws = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1.0"

# Database
rusqlite = { version = "0.38", features = ["bundled"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
regex = "1"

# HTTP client / WebSocket testing
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Telegram
teloxide = { version = "0.17", features = ["macros"] }

# GUI framework
eframe = "0.33.3"
egui = "0.33.3"
egui_extras = "0.33.3"

# Internal crates
claw-config = { path = "crates/claw-config" }
claw-core = { path = "crates/claw-core" }
claw-gateway = { path = "crates/claw-gateway" }
claw-routing = { path = "crates/claw-routing" }
claw-channels = { path = "crates/claw-channels" }
claw-plugins = { path = "crates/claw-plugins" }
claw-dispatch = { path = "crates/claw-dispatch" }
claw-db = { path = "crates/claw-db" }
