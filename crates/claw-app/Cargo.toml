[package]
name = "claw-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "claw"
path = "src/main.rs"

[features]
default = ["telegram", "whatsapp", "discord"]
telegram = ["dep:claw-telegram"]
whatsapp = ["dep:claw-whatsapp"]
discord = ["dep:claw-discord"]

[dependencies]
claw-core.workspace = true
claw-config.workspace = true
claw-channels.workspace = true
claw-routing.workspace = true
claw-gateway.workspace = true
claw-plugins.workspace = true
claw-dispatch.workspace = true
claw-claude-code.workspace = true
claw-db.workspace = true
claw-agent-models.workspace = true
claw-agent-runtime.workspace = true
claw-agent-tools.workspace = true
claw-agent-workspace.workspace = true
claw-telegram = { workspace = true, optional = true }
claw-whatsapp = { workspace = true, optional = true }
claw-discord = { workspace = true, optional = true }
rusqlite.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
