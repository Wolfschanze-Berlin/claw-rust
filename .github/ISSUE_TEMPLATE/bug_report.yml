name: Bug Report
description: Report a bug in claw-rust
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug
    validations:
      required: true

  - type: dropdown
    id: crate
    attributes:
      label: Affected Crate
      options:
        - claw-core
        - claw-config
        - claw-channels
        - claw-routing
        - claw-dispatch
        - claw-gateway
        - claw-plugins
        - claw-db
        - claw-app
        - claw-gui
        - Multiple / Unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      value: |
        1.
        2.
        3.

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant logs or error messages
      render: shell

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      placeholder: "e.g., 1.85.0"
