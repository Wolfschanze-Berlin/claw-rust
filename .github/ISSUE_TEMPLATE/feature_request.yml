name: Feature Request
description: Suggest a new feature or enhancement
labels: ["task"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: dropdown
    id: crate
    attributes:
      label: Target Crate
      options:
        - claw-core
        - claw-config
        - claw-channels
        - claw-routing
        - claw-dispatch
        - claw-gateway
        - claw-plugins
        - claw-db
        - claw-app
        - claw-gui
        - New crate
        - Multiple / Unknown
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this is done?
      value: |
        - [ ]
        - [ ]

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Dependencies, related issues, OpenClaw TS reference, etc.
